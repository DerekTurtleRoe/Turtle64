name: Linux Packaging

# Builds all four Linux package formats (.deb, .rpm, .AppImage, .flatpak) on every push/PR so
# packaging regressions are caught immediately, not just when cutting a release. Artifacts are
# uploaded for inspection; `release.yml` re-runs equivalent steps and attaches the results to
# tagged GitHub Releases.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: turtle64
  APP_ID: io.github.derekturtleroe.Turtle64

concurrency:
  group: linux-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb-rpm:
    name: Build .deb / .rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-packaging-deb-rpm

      - name: Install cargo-deb and cargo-generate-rpm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build .deb
        run: cargo deb --no-build

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: turtle64-deb
          path: target/debian/*.deb
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: turtle64-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

  appimage:
    name: Build .AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev fuse

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-packaging-appimage

      - name: Build release binary
        run: cargo build --release --locked

      - name: Download linuxdeploy
        run: |
          curl -L -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-appimage-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage

      - name: Assemble AppDir and build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          PATH: ${{ github.workspace }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          mkdir -p AppDir/usr/bin
          cp assets/icons/turtle64_256.png ${{ env.APP_ID }}.png
          cp target/release/${{ env.BIN_NAME }} AppDir/usr/bin/
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/${{ env.BIN_NAME }} \
            --desktop-file packaging/linux/${{ env.APP_ID }}.desktop \
            --icon-file ${{ env.APP_ID }}.png \
            --output appimage

      - name: Rename AppImage
        run: mv Turtle64-*.AppImage turtle64-x86_64.AppImage

      - name: Upload .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: turtle64-appimage
          path: turtle64-x86_64.AppImage
          if-no-files-found: error

  flatpak:
    name: Build .flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Generate cargo-sources.json
        run: |
          pip3 install --user aiohttp tomlkit
          curl -L -o flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: turtle64-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.derekturtleroe.Turtle64.yml
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: turtle64-flatpak
