name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: turtle64

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: turtle64-windows-x86_64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: turtle64-macos-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: turtle64-macos-aarch64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: turtle64-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "$stage/"
          Copy-Item "README.md" "$stage/"
          Copy-Item "LICENSE" "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="stage"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$stage/"
          cp README.md LICENSE "$stage/"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            (cd "$stage" && zip -r "../${{ matrix.artifact_name }}" .)
          else
            tar -czf "${{ matrix.artifact_name }}" -C "$stage" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create/update release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
