name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: turtle64

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: turtle64-windows-x86_64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: turtle64-macos-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: turtle64-macos-aarch64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: turtle64-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "$stage/"
          Copy-Item "README.md" "$stage/"
          Copy-Item "LICENSE.md" "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="stage"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$stage/"
          cp README.md LICENSE.md "$stage/"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            (cd "$stage" && zip -r "../${{ matrix.artifact_name }}" .)
          else
            tar -czf "${{ matrix.artifact_name }}" -C "$stage" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  linux-deb-rpm:
    name: Build Linux .deb / .rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-deb-rpm

      - name: Install cargo-deb and cargo-generate-rpm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build .deb
        run: cargo deb --no-build

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Rename packages
        run: |
          mv target/debian/*.deb turtle64-x86_64.deb
          mv target/generate-rpm/*.rpm turtle64-x86_64.rpm

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: turtle64-x86_64.deb
          path: turtle64-x86_64.deb
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@v7
        with:
          name: turtle64-x86_64.rpm
          path: turtle64-x86_64.rpm
          if-no-files-found: error

  linux-appimage:
    name: Build Linux .AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev fuse

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-appimage

      - name: Build release binary
        run: cargo build --release --locked

      - name: Download linuxdeploy
        run: |
          curl -L -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Assemble AppDir and build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/${{ env.BIN_NAME }} AppDir/usr/bin/
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/${{ env.BIN_NAME }} \
            --desktop-file packaging/linux/io.github.derekturtleroe.Turtle64.desktop \
            --icon-file assets/icons/turtle64_256.png \
            --output appimage

      - name: Rename AppImage
        run: mv Turtle64-*.AppImage turtle64-x86_64.AppImage

      - name: Upload .AppImage
        uses: actions/upload-artifact@v7
        with:
          name: turtle64-x86_64.AppImage
          path: turtle64-x86_64.AppImage
          if-no-files-found: error

  linux-flatpak:
    name: Build Linux .flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Generate cargo-sources.json
        run: |
          pip3 install --user aiohttp tomlkit
          curl -L -o flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: turtle64-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.derekturtleroe.Turtle64.yml
          cache-key: flatpak-builder-release-${{ github.sha }}
          artifact-name: turtle64-x86_64.flatpak

  release:
    name: Publish GitHub Release
    needs: [build, linux-deb-rpm, linux-appimage, linux-flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create/update release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
