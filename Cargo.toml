[package]
name = "turtle64"
version = "0.1.0"
edition = "2021"
description = "Turtle64 - N64 ROM converter, header inspector, and verification tool"
license = "GPL-2.0-or-later"
repository = "https://github.com/derekturtleroe/Turtle64"
readme = "README.md"

[[bin]]
name = "turtle64"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
rfd = "0.15"
md-5 = "0.10"
sha1 = "0.10"
crc32fast = "1.4"
roxmltree = "0.20"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
